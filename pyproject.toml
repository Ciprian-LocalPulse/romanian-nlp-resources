[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ro-open-nlp"
version = "0.1.0"
description = "Instrumente deschise pentru seturi de date si modele NLP romanesti."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Comunitatea RoOpenNLP"}]
keywords = ["romanian", "nlp", "datasets", "ner", "speech-to-text", "disinformation"]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10"
]
ml = [
  "scikit-learn>=1.5",
  "datasets>=2.20",
  "transformers>=4.42",
  "evaluate>=0.4"
]

[project.scripts]
ro-open-nlp = "ro_open_nlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
